    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
        <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">
            <i class="fa-solid fa-plane"></i>
            <h2>Aeropuerto</h2>
        </div>
        <ul>
            <li>
                <a href="admin.html">
                    <i class="fa-solid fa-chart-line"></i> Dashboard
                </a>
            </li>
            <li>
                <a href="aerolineas.html">
                    <i class="fa-solid fa-building"></i> Aerolíneas
                </a>
            </li>
            <li>
                <a href="aeronaves.html">
                    <i class="fa-solid fa-plane-circle-check"></i> Aeronaves
                </a>
            </li>
            <li>
                <a href="rutas.html">
                    <i class="fa-solid fa-route"></i> Rutas
                </a>
            </li>
            <li>
                <a href="vuelos.html">
                    <i class="fa-solid fa-plane-departure"></i> Vuelos
                </a>
            </li>
            <li class="active">
                <a href="pasajeros.html">
                    <i class="fa-solid fa-users"></i> Pasajeros
                </a>
            </li>
            <li>
                <a href="tripulacion.html">
                    <i class="fa-solid fa-user-tie"></i> Tripulación
                </a>
            </li>
            <li>
                <a href="reservaciones.html">
                    <i class="fa-solid fa-ticket"></i> Reservaciones
                </a>
            </li>
            <li>
                <a href="../../index.html">
                    <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
                </a>
            </li>
        </ul>
    </div>

    <!-- CONTENIDO -->
    <main>
        <header>
            <div>
                <h1>Nuevo Pasajero</h1>
                <p>Registro de pasajeros en el sistema aeroportuario</p>
            </div>
            <a href="pasajeros.html" class="btn-primary">
                <i class="fa-solid fa-arrow-left"></i> Volver
            </a>
        </header>

        <section class="form-container">
            <form id="nuevoPasajero" class="form-grid">

                <!-- DATOS PERSONALES -->
                <div class="form-group">
                    <label>Nombre(s)</label>
                    <input id="nombre" type="text" placeholder="Juan Carlos"  minlength="3" maxlength="50" required>
                </div>
                <div class="form-group">
                    <label>Apellidos</label>
                    <input id="apellido" type="text" placeholder="Pérez" minlength="3" maxlength="50" required>
                </div>
                <div class="form-group">
                    <label>Fecha de Nacimiento</label>
                    <input id="fechaNacimiento" type="date" required>
                </div>
                <div class="form-group">
                    <label>Nacionalidad</label>
                    <input id="nacionalidad" type="text" placeholder="Mexicana" minlength="3" maxlength="20" required>
                </div>
                <div class="form-group">
                    <label>Pasaporte</label>
                    <input id="pasaporte" type="text" placeholder="MX12345678" minlength="8" maxlength="10" required>
                </div>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input id="email" type="email" placeholder="correo@ejemplo.com" maxlength="50" required>
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input id="telefono" type="number" placeholder="4491234567" minlength="10" maxlength="10" required>
                </div>
                <div class="form-group">
                    <label>Vuelos Acumulados</label>
                    <input id="vuelosAcumulados" type="number" value="0" min="0" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-save">
                        <i class="fa-solid fa-floppy-disk"></i> Guardar Pasajero
                    </button>
                </div>
            </form>
        </section>
    </main>
</body>
<script src="../../Assets/JS/Admin/nuevo_pasajero.js"></script>
</html>
